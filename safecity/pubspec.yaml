name: safecity
description: "SafeCity FYP Project"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Internet
  http: ^1.2.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5

  # Google Maps & Polylines
  google_maps_flutter: ^2.12.3
  flutter_polyline_points: ^2.1.0

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Permissions & Utilities
  permission_handler: ^12.0.0+1
  url_launcher: ^6.3.0

  # Camera
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/pakistan_map.png
    - assets/icons/
    - assets/map_styles/night_style.json